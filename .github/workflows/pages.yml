# Publishes the hosting/ folder to https://s3od177.github.io/cue-for-bingers/
# (OAuth client-metadata.json, privacy policy, icon). Runs when hosting/ changes on main.
name: Publish hosting/ to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["hosting/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hosting
      - id: deployment
        uses: actions/deploy-pages@v4
